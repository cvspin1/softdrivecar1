<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soft Drive Car — Location de voitures au Maroc</title>
<meta name="description" content="Soft Drive Car : location de voitures et livraison partout au Maroc. Réservation directe sur WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="carG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3a42"/><stop offset=".55" stop-color="#1c1c21"/><stop offset="1" stop-color="#0e0e11"/></linearGradient><radialGradient id="glowG"><stop offset="0" stop-color="#DC2626" stop-opacity=".55"/><stop offset="1" stop-color="#DC2626" stop-opacity="0"/></radialGradient></defs></svg>
<header class="bar">
  <a class="brand" href="#top" id="brand"></a>
  <nav>
    <a href="#fleet" data-i18n="nav_fleet"></a>
    <a href="#how" data-i18n="nav_how"></a>
    <a href="#faq" data-i18n="nav_faq"></a>
    <a href="#where" data-i18n="nav_loc"></a>
  </nav>
  <div class="lang" id="lang" role="group" aria-label="Language"></div>
</header>

<main id="top">
  <section class="hero">
    <h1 id="tagline"></h1>
    <div class="pick">
      <label for="heroLoc" data-i18n="pick_label"></label>
      <select id="heroLoc"></select>
      <a class="btn" href="#fleet" data-i18n="pick_cta"></a>
      <a class="btn ghost" id="mapHero" target="_blank" rel="noopener" data-i18n="map_btn"></a>
    </div>
  </section>

  <section id="fleet" class="wrap">
    <h2 data-i18n="fleet_title"></h2>
    <div class="filters"><div class="chips" id="chips" role="group" aria-label="Category"></div><div class="chips" id="gbChips" role="group" aria-label="Gearbox"></div></div>
    <div class="grid" id="cars"></div>
  </section>

  <section id="book" class="wrap">
    <form id="form" class="card form" novalidate>
      <h2 data-i18n="form_title"></h2>
      <label><span data-i18n="name"></span><input name="name" required autocomplete="name"></label>
      <label><span data-i18n="phone"></span><input name="phone" type="tel" required inputmode="tel" autocomplete="tel" placeholder="+212 6…"></label>
      <label><span data-i18n="pickup"></span><select name="loc" id="loc" required></select></label>
      <div class="two">
        <label><span data-i18n="from"></span><input name="from" id="from" type="date" required></label>
        <label><span data-i18n="to"></span><input name="to" id="to" type="date" required></label>
      </div>
      <label><span data-i18n="car"></span><select name="car" id="car" required></select></label>
      <label class="check"><input type="checkbox" id="ok" required><span id="okText"></span></label>
      <dl class="sum" aria-live="polite">
        <div><dt data-i18n="days"></dt><dd id="sDays">—</dd></div>
        <div id="feeRow" hidden><dt data-i18n="fee"></dt><dd id="sFee"></dd></div>
        <div class="tot"><dt data-i18n="total"></dt><dd id="sTotal">—</dd></div>
      </dl>
      <p class="err" id="err" role="alert" hidden></p>
      <button class="btn wa" type="submit" data-i18n="send"></button>
      <p class="small" id="note"></p>
    </form>
  </section>

  <section id="how" class="wrap">
    <h2 data-i18n="how_title"></h2>
    <ol class="steps">
      <li><b data-i18n="s1"></b><span data-i18n="s1d"></span></li>
      <li><b data-i18n="s2"></b><span data-i18n="s2d"></span></li>
      <li><b data-i18n="s3"></b><span data-i18n="s3d"></span></li>
    </ol>
  </section>

  <section class="wrap two-col">
    <div><h2 data-i18n="terms_title"></h2><ul class="terms" id="terms"></ul></div>
    <div id="faq"><h2 data-i18n="faq_title"></h2><div id="faqList"></div></div>
  </section>
  <section id="where" class="wrap">
    <div class="loc-card">
      <div><h2 data-i18n="loc_title" style="margin:0"></h2><p data-i18n="loc_text"></p></div>
      <div class="acts">
        <a class="btn" id="mapBtn" target="_blank" rel="noopener" data-i18n="map_btn"></a>
        <a class="btn ghost" id="dirBtn" target="_blank" rel="noopener" data-i18n="dir_btn"></a>
      </div>
    </div>
  </section>
</main>

<footer class="foot"><span id="fName"></span><span data-i18n="footer"></span><a id="fWa" target="_blank" rel="noopener"></a><a id="fMail"></a><a id="fIg" target="_blank" rel="noopener">Instagram</a></footer>

<script src="src/data/agencyConfig.js"></script>
<script src="src/data/i18n.js"></script>
<script src="src/services/leads.js"></script>
<script src="app.js"></script>
</body>
</html>
